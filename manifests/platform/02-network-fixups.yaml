# Two host-level sysctl fixups on the kind node, both needed once VMs use
# KubeVirt "bridge" binding on the pod network:
#
#   1. proxy_arp on veths: the VM gets its pod IP via DHCP but believes the
#      whole /24 is on-link, so it ARPs for other pods directly. Without
#      proxy_arp on the host side of the veth nobody answers.
#   2. rp_filter=2 (loose): management pods reach the VIP via br-baremetal,
#      but the VM replies out of eth0 (its default route). Strict reverse-path
#      filtering drops that asymmetric reply as spoofed.
#
# Polls every 5s so veths created later (new VMs) are covered too.
# From https://github.com/lentzi90/playground (Metal3/kubevirtbmc-test/).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-fixups
  namespace: kube-system
  labels:
    app: network-fixups
spec:
  selector:
    matchLabels:
      app: network-fixups
  template:
    metadata:
      labels:
        app: network-fixups
    spec:
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 5
      tolerations:
      - operator: Exists
      containers:
      - name: network-fixups
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo 1 > /proc/sys/net/ipv4/conf/default/proxy_arp
          echo 2 > /proc/sys/net/ipv4/conf/default/rp_filter
          echo 2 > /proc/sys/net/ipv4/conf/all/rp_filter
          while true; do
            for veth in $(ls /proc/sys/net/ipv4/conf/ | grep '^veth'); do
              if [ "$(cat /proc/sys/net/ipv4/conf/$veth/proxy_arp 2>/dev/null)" = "0" ]; then
                echo 1 > /proc/sys/net/ipv4/conf/$veth/proxy_arp && echo "proxy_arp on $veth"
              fi
              if [ "$(cat /proc/sys/net/ipv4/conf/$veth/rp_filter 2>/dev/null)" = "1" ]; then
                echo 2 > /proc/sys/net/ipv4/conf/$veth/rp_filter && echo "rp_filter=2 on $veth"
              fi
            done
            sleep 5
          done
        securityContext:
          privileged: true
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 50m, memory: 32Mi}
