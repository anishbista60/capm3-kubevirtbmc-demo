# The BareMetalHost for one VM. Metal3 only sees a Redfish BMC address and a
# boot MAC — nothing in here says "virtual machine".
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: kvbmc-node-2
  namespace: default
  labels:
    capm3-demo.metal3.io/host: "true"
spec:
  online: true
  bootMode: UEFI
  bootMACAddress: "52:54:00:00:00:02"
  bmc:
    address: redfish-virtualmedia+http://kvbmc-node-2-virtbmc.default.svc.cluster.local:80/redfish/v1/Systems/1
    credentialsName: bmc-credentials
  rootDeviceHints:
    deviceName: /dev/vda
