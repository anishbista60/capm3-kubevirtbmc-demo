# Workers: a MachineDeployment of BareMetalHosts. The KubeadmConfigTemplate
# name carries the Kubernetes version because bootstrap templates are treated
# as immutable — an upgrade creates a new one and points the MachineDeployment
# at it, which is what triggers the rollout (manifests/upgrade/30-workers.yaml).
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: kvbmc-cluster-workers-v1-35-9
  namespace: default
spec:
  template:
    spec:
      files:
      - path: /usr/local/bin/install-k8s.sh
        owner: root:root
        permissions: "0755"
        contentFrom:
          secret:
            name: install-k8s
            key: install-k8s.sh
      - path: /etc/capm3-demo/kubernetes-version
        owner: root:root
        permissions: "0644"
        content: "v1.35.9"
      preKubeadmCommands:
      - /usr/local/bin/install-k8s.sh
      joinConfiguration:
        nodeRegistration:
          name: "{{ ds.meta_data.name }}"
          kubeletExtraArgs:
          - name: node-labels
            value: "metal3.io/uuid={{ ds.meta_data.uuid }}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3MachineTemplate
metadata:
  name: kvbmc-cluster-workers
  namespace: default
spec:
  nodeReuse: false
  template:
    spec:
      automatedCleaningMode: metadata
      dataTemplate:
        name: kvbmc-cluster-workers
      image:
        url: http://10.96.200.200:8080/node-image.img
        checksum: http://10.96.200.200:8080/node-image.img.sha256sum
        checksumType: sha256
        diskFormat: qcow2
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: Metal3DataTemplate
metadata:
  name: kvbmc-cluster-workers
  namespace: default
spec:
  metaData:
    objectNames:
    - key: machine_name
      object: machine
    - key: metal3machine_name
      object: metal3machine
    - key: bmh_name
      object: baremetalhost
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: kvbmc-cluster-workers
  namespace: default
  labels:
    cluster.x-k8s.io/cluster-name: kvbmc-cluster
    nodepool: workers
spec:
  clusterName: kvbmc-cluster
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: kvbmc-cluster
      nodepool: workers
  rollout:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        # Replace in place: release one host, then claim one. Needs no spare.
        maxSurge: 0
        maxUnavailable: 1
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: kvbmc-cluster
        nodepool: workers
    spec:
      clusterName: kvbmc-cluster
      version: v1.35.9
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: kvbmc-cluster-workers-v1-35-9
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: Metal3MachineTemplate
        name: kvbmc-cluster-workers
