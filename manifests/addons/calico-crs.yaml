# Installs Calico into every workload cluster labelled cni=calico, once the
# cluster's API is reachable. The calico-cni ConfigMap is generated by
# run-demo.sh from addons/calico (it is ~300 KB, hence server-side apply).
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: calico-cni
  namespace: default
spec:
  clusterSelector:
    matchLabels:
      cni: calico
  strategy: ApplyOnce
  resources:
  - name: calico-cni
    kind: ConfigMap
